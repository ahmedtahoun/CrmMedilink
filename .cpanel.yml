---
# Spaceship cPanel "Git Version Control" deploy hook.
# cPanel clones this repo and runs these tasks on "Deploy HEAD Commit".
# It does NOT run `npm build` — the built app/dist/ must be committed on the
# branch cPanel tracks (see README.md > Deploy).
#
# EDIT THIS: set DEPLOYPATH to the document root of the crm.medilink360.ai
# subdomain (cPanel > Domains shows it, e.g. /home/USER/crm.medilink360.ai).
deployment:
  tasks:
    - export DEPLOYPATH=/home/CPANEL_USER/crm.medilink360.ai
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/rm -rf "$DEPLOYPATH"/assets
    - /bin/cp -R app/dist/. "$DEPLOYPATH"/
    - /bin/cp app/public/.htaccess "$DEPLOYPATH"/.htaccess
